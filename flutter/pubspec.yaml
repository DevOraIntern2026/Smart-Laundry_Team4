name: smart_laundry
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/welcome/nivo_logo_only.png
    - assets/images/Auth/badge_laundry.png 
    - assets/images/Auth/google.png
    - assets/images/Auth/banner_logo.png
    - assets/images/Auth/reset_lock.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300

        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400

        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500

        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700

        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800

        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900
